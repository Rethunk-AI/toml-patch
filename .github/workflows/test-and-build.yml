name: Test and Build
on:
  push:
    branches:
      - latest
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - node-version: 22.x
          - node-version: 24.x
          - node-version: 26.x
            benchmark: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false

      # Protection Against Supply Chain Attacks
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall
          firewall-version: latest

      - name: Install
        run: sfw pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test dev package
        run: pnpm run test:dev

      - name: Install Playwright browsers
        run: pnpm run playwright:install

      - name: Test
        run: pnpm run test:all

      - name: Fuzz test
        run: pnpm run fuzz1

      - name: Specs
        run: pnpm run specs

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable

      - name: Install toml-test
        run: go install github.com/toml-lang/toml-test/v2/cmd/toml-test@9eef1b959e0449d41a31d4e4e0a839faee534b36

      - name: Go Test (toml-test)
        run: pnpm run test:go

      - name: Create build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/
          name: dist-${{ matrix.node-version }}

  # One required check for branch protection so a matrix leg that never ran is not treated as passing.
  all-checks:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any check did not succeed
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "build=${{ needs.build.result }}"
            exit 1
          fi
          echo "all checks passed"
